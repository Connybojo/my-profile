<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

  :root{
    --paper: #f6f4ee;
    --ink: #1c2733;
    --ink-soft: #4a5666;
    --rule: #d8d3c4;
    --gold: #93711f;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet{
    max-width: 560px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 96px 28px 64px;
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  .profile-photo{
    width: 112px;
    height: 112px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--rule);
    margin-bottom: 24px;
  }

  h1{
    font-size: clamp(2.6rem, 8vw, 3.4rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 0 0 16px;
  }

  p{
    font-size: 1.1rem;
    color: var(--ink-soft);
    max-width: 44ch;
    margin: 0 auto;
  }

  h2{
    font-size: 1.3rem;
    font-weight: 600;
    margin: 56px 0 0;
  }

  .projects{
    list-style: none;
    padding: 0;
    margin: 20px auto 0;
    max-width: 44ch;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .projects li{
    background: #fbfaf6;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 20px 24px;
  }
  .projects a{
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    transition: color 0.2s ease;
  }
  .projects a:hover{ color: var(--gold); }
  .projects p{
    font-size: 0.98rem;
    margin-top: 6px;
  }

  footer{
    margin-top: auto;
    padding-top: 64px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 28px;
  }

  footer a{
    color: var(--ink);
    font-size: 1.4rem;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  footer a:hover{ color: var(--gold); }

  a:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  @media (max-width: 520px){
    .sheet{ padding: 64px 20px 48px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <main>
    <img src="images/hugo.jpg" alt="Hugo" class="profile-photo">
    <h1>Hugo</h1>
    <p>Interested in finance, markets and how deals come together. Off the clock: golf, chess, tennis and a good book.</p>

    <h2>My projects</h2>
    <ul class="projects">
      <li>
        <a href="https://linclund.com/2026/01/11/openlane/" target="_blank" rel="noopener">Openlane</a>
        <p>LINC M&amp;A pitch deck</p>
      </li>
      <li>
        <a href="https://linclund.com/2025/06/02/oriola-corporation/" target="_blank" rel="noopener">Oriola</a>
        <p>LINC equity research report</p>
      </li>
    </ul>
  </main>

  <footer>
    <a href="https://x.com/bogren20" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
    <a href="https://www.instagram.com/hugo_bogren/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://www.linkedin.com/in/hugo-bogren-3b5254238/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
  </footer>

</div>
</body>
</html>
